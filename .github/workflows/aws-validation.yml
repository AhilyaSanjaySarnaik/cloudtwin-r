
name: CloudTwin AWS Validation

on:
  workflow_dispatch:
    inputs:
      run_live_benchmark:
        description: Run the Phase 4 live IAM benchmark
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run automated tests
        run: |
          bundle exec ruby -Itest -e \
            'Dir["test/test_*.rb"].sort.each { |f| require_relative f }'

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          retry-max-attempts: 2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Run CloudTwin live validation
        run: |
          mkdir -p experiments/results
          bundle exec ruby bin/cloudtwin validate \
            fixtures/validation_scenario.json \
            --live > experiments/results/aws-validation.json

      - name: Display validation result
        run: cat experiments/results/aws-validation.json

      - name: Run CloudTwin Phase 4 live benchmark
        if: ${{ inputs.run_live_benchmark == true }}
        run: |
          mkdir -p experiments/results
          bundle exec ruby experiments/benchmark.rb --live

      - name: Upload Phase 4 benchmark reports
        if: ${{ always() && inputs.run_live_benchmark == true }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudtwin-phase4-benchmark
          path: |
            experiments/results/benchmark.json
            experiments/results/benchmark.csv
          if-no-files-found: warn

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudtwin-aws-validation
          path: experiments/results/aws-validation.json
          if-no-files-found: warn
